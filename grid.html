<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="header">
            <h1>Admin Panel</h1>
        </header>

        <aside class="sidebar">
            <nav>
                <ul>
                    <li>Inicio</li>
                    <li>Usuarios</li>
                    <li>Reportes</li>
                    <li>Ajustes</li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <h2>Vista Principal</h2>
            <div class="card-grid">
                <div class="card">Ventas</div>
                <div class="card">Visitas</div>
                <div class="card">Tareas</div>
                <div class="card">Alertas</div>
                <div class="card">Métricas</div>
                <div class="card">Logs</div>
            </div>
        </main>

        <footer class="footer">
            <p>© 2026 Dashboard Administrativo - Alianza PRO</p>
        </footer>
    </div>

</body>
</html>
